[package]
name = "flpc"
version = "0.1.0"
edition = "2024"

[features]
tokio = ["dep:bytes", "dep:tokio-util"]

[dependencies]
bytes = { version = "1", optional = true }
tokio-util = { version = "0.7", features = ["codec"], optional = true }

[dev-dependencies]
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
